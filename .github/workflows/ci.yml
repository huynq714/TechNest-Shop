name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/technest-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/technest-app
        run: npm ci --include=dev

      - name: Lint OpenAPI spec
        run: npx -y @redocly/cli@latest lint --config redocly.yaml docs/openapi.yaml

      - name: Regenerate OpenAPI types
        working-directory: frontend/technest-app
        run: npm run api:types

      - name: Verify generated types are committed
        run: git diff --exit-code -- frontend/technest-app/src/lib/api-contract.d.ts

      - name: Typecheck frontend API layer
        working-directory: frontend/technest-app
        run: npm run typecheck

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ecommerce
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/technest-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/technest-app/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck frontend API layer
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  docker-images:
    runs-on: ubuntu-latest
    needs:
      - contract
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t technest-backend:ci backend/ecommerce

      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL= -t technest-frontend:ci frontend/technest-app

      - name: Shell syntax check
        run: bash -n scripts/*.sh

      - name: Deployment preflight example
        run: ./scripts/deploy-preflight.sh .env.example compose.yaml
